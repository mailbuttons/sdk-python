line-length = 100
target-version = "py311"

[lint]
select = [
    "E",   # pycodestyle
    "F",   # pyflakes
    "W",   # warnings
    "I",   # isort
    "N",   # naming
    "UP",  # pyupgrade
    "B",   # bugbear
    "RUF", # ruff
]
ignore = ["E501"] # line length handled by formatter

[lint.per-file-ignores]
"tests/*" = ["N802"]
